name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Enhetstester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør enhetstester
        run: npm test

  e2e:
    name: E2E-tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Playwright-nettlesere
        run: npx playwright install --with-deps chromium

      - name: Lag .env.local fra secrets
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          IDPORTEN_CLIENT_ID: ${{ secrets.IDPORTEN_CLIENT_ID }}
          IDPORTEN_PRIVATE_KEY_JWK: ${{ secrets.IDPORTEN_PRIVATE_KEY_JWK }}
          MASKINPORTEN_CLIENT_ID: ${{ secrets.MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_PRIVATE_KEY_JWK: ${{ secrets.MASKINPORTEN_PRIVATE_KEY_JWK }}
          STANDARD_BRUKER: ${{ secrets.STANDARD_BRUKER }}
        run: |
          printf 'AUTH_SECRET=%s\n'                  "$AUTH_SECRET"                  >> .env.local
          printf 'AUTH_URL=http://localhost:3000\n'                                  >> .env.local
          printf 'IDPORTEN_CLIENT_ID=%s\n'           "$IDPORTEN_CLIENT_ID"           >> .env.local
          printf 'IDPORTEN_PRIVATE_KEY_JWK=%s\n'     "$IDPORTEN_PRIVATE_KEY_JWK"     >> .env.local
          printf 'MASKINPORTEN_CLIENT_ID=%s\n'       "$MASKINPORTEN_CLIENT_ID"       >> .env.local
          printf 'MASKINPORTEN_PRIVATE_KEY_JWK=%s\n' "$MASKINPORTEN_PRIVATE_KEY_JWK" >> .env.local
          printf 'STANDARD_BRUKER=%s\n'              "$STANDARD_BRUKER"              >> .env.local

      - name: Kjør e2e-tester
        env:
          STANDARD_BRUKER: ${{ secrets.STANDARD_BRUKER }}
        run: npm run test:e2e

      - name: Last opp Playwright-rapport ved feil
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy til Vercel
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Vercel CLI
        run: npm install -g vercel@latest

      - name: Hent Vercel-miljøvariabler
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Bygg
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
